# XcodeGen spec — generate the Xcode project with:
#   brew install xcodegen
#   cd app/iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: io.github.kuvandikov.scancardnfc
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: "" # set your Apple team ID
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    # Generates a shared "iosApp" scheme, so Xcode, xcodebuild and Android Studio can pick the app.
    scheme: {}
    # Info.plist and the entitlements are hand-written (NFC keys, AID list) and referenced via
    # INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS below. Do not add `info:` / `entitlements:` here:
    # XcodeGen would regenerate those files and drop the NFC configuration.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kuvandikov.scancardnfc.app
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :app:shared:embedAndSignAppleFrameworkForXcode
