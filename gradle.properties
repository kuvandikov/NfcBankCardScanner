# Gradle
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Android / Kotlin
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
kotlin.code.style=official

# Dokka 2 (Gradle plugin V2)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Publishing (read by com.vanniktech.maven.publish, accompanist style).
# Each published module sets POM_ARTIFACT_ID / POM_NAME in its own gradle.properties.
GROUP=io.github.kuvandikov
VERSION_NAME=1.0.0

POM_DESCRIPTION=Reads the card number and expiry date of contactless bank cards (EMV/NFC) on Android.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/kuvandikov/NfcBankCardScanner/
POM_SCM_URL=https://github.com/kuvandikov/NfcBankCardScanner/
POM_SCM_CONNECTION=scm:git:git://github.com/kuvandikov/NfcBankCardScanner.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/kuvandikov/NfcBankCardScanner.git

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_DEVELOPER_ID=kuvandikov
POM_DEVELOPER_NAME=Anvarbek Kuvandikov
POM_DEVELOPER_URL=https://github.com/kuvandikov/
